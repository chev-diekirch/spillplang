<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#395aa0">
<meta name="apple-mobile-web-app-title" content="Spillplang">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CHEV Spillplang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: club-blue masthead with the CHEV crest, then one narrow column; tabs switch weekend view / team view. Colors taken from the crest. */
:root{
  --bg:#ffffff; --surface:#f7f8fa; --line:#d3d6dc; --fg:#1d2433; --muted:#5c6475;
  --brand:#395aa0; --on-brand:#ffffff; --brand-muted:#cdd8ef;
  --accent:#395aa0; --accent-soft:#e3e9f5; --home:#395aa0; --on-home:#ffffff; --crest:#fbcb13; --home-soft:#e3e9f5; --away-soft:#eceef2;
  --cup:#ffff8c; --on-cup:#4a4300; --late:#e15242; --on-late:#ffffff;
  --warn:#9a5b00; --warn-soft:#fbefd9;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1525; --surface:#162038; --line:#2a3858; --fg:#e8edf6; --muted:#9ba7bd;
  --brand:#2f4c8a; --on-brand:#ffffff; --brand-muted:#b9c8e8;
  --accent:#93b0ea; --accent-soft:#1d2d50; --home:#5a7fd0; --on-home:#ffffff; --crest:#fbcb13; --home-soft:#1d2d50; --away-soft:#1c2842;
  --cup:#57521a; --on-cup:#fff7a6; --late:#c9463a; --on-late:#ffffff;
  --warn:#f0b75c; --warn-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1525; --surface:#162038; --line:#2a3858; --fg:#e8edf6; --muted:#9ba7bd;
  --brand:#2f4c8a; --on-brand:#ffffff; --brand-muted:#b9c8e8;
  --accent:#93b0ea; --accent-soft:#1d2d50; --home:#5a7fd0; --on-home:#ffffff; --crest:#fbcb13; --home-soft:#1d2d50; --away-soft:#1c2842;
  --cup:#57521a; --on-cup:#fff7a6; --late:#c9463a; --on-late:#ffffff;
  --warn:#f0b75c; --warn-soft:#3a2c12; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.masthead{background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--crest);padding-inline:16px;padding-block:14px}
.masthead .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
.masthead img{width:64px;height:auto;flex:none}
.masthead .txt{min-width:0}
.masthead .club{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--crest);margin:0}
.masthead h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
.masthead p{margin:.2rem 0 0;color:var(--brand-muted);font-size:.8rem}
.masthead a{color:var(--on-brand)}
.masthead .txt{flex:1}
.reload{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--brand-muted);background:transparent;color:var(--on-brand);cursor:pointer;display:grid;place-items:center;padding:0}
.reload svg{width:22px;height:22px}
.reload:hover{background:rgba(255,255,255,.12)}
.reload.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reload.busy svg{animation:none;opacity:.5}}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px 40px}
.tabs{display:flex;gap:4px;margin:18px 0 14px;background:var(--away-soft);padding:4px;border-radius:6px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .8rem var(--body);text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-radius:4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;font-size:1.2rem;cursor:pointer;flex:none}
.weeknav .label{flex:1;min-width:0;text-align:center}
.weeknav .label strong{display:block;font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--accent)}
.weeknav .label span{font-size:.8rem;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--away-soft);color:var(--muted)}
.chip.home{background:var(--home-soft);color:var(--home)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
h2.day{font-family:var(--display);font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
h2.day small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;font-size:.8rem}
.list{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.game:nth-child(odd){background:var(--surface)}
.game{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.game.is-home{box-shadow:inset 3px 0 0 var(--home)}
.game.past{opacity:.55}
.time{font-family:var(--display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
.time small{display:block;font-family:var(--body);font-size:.72rem;font-weight:500;color:var(--muted);line-height:1.1}
.info{min-width:0}
.team{font-weight:600}
.opp{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.tag{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;background:var(--away-soft);color:var(--muted)}
.tag.home{background:var(--home);color:var(--on-home)}
.tag.away{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.seg{display:flex;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;border-left:1px solid var(--line);background:transparent;color:var(--fg);font:600 .9rem var(--body);padding:9px 6px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.seg button[data-f="home"][aria-pressed="true"]{background:var(--home);color:var(--on-home)}
.seg button span{font-weight:500;opacity:.75}
.tag.cup{background:var(--cup);color:var(--on-cup)}
.tag.late{background:var(--late);color:var(--on-late)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
select,input[type=date]{font:500 1rem var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;box-sizing:border-box}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;grid-column:1/-1}
.check input{width:18px;height:18px;accent-color:var(--home)}
.quick{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.quick button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 .82rem var(--body);padding:5px 10px;border-radius:999px;cursor:pointer}
.month{margin-top:20px}
footer{margin-top:28px;font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const TEAMS=[
 ["h1","Hommes 1"],["d1","Dames 1"],["h2","Hommes 2"],["d2","Dames 2"],
 ["u17g","U17 Garçons"],["u17f","U17 Filles"],["u15g","U15 Garçons"],
 ["u13g","U13 Garçons"],["u13m","U13 Mixtes"],["u11","U11 Mixtes"],["u9","U9 Mixtes"],["u7","U7 Mixtes – Wibbelgrupp"]
];

const teamName=Object.fromEntries(TEAMS);
const DAY=864e5;
const d=(y,m,dd)=>new Date(y,m,dd);
function parseDate(s){
  if(!s) return null;
  let m=s.match(/^(\d{1,2})-(\d{1,2})\.(\d{2})\.(\d{2})$/);
  if(m){const y=2000+ +m[4],mo=+m[3]-1;return {start:d(y,mo,+m[1]),end:d(y,mo,+m[2]),range:true};}
  m=s.match(/^(\d{2})\.(\d{2})\.(\d{2})$/);
  const x=d(2000+ +m[3],+m[2]-1,+m[1]);return {start:x,end:x,range:false};
}
let GAMES=[];
function buildGames(rows){return rows.map(([team,nr,date,time,home,away])=>{
  const dt=parseDate(date);
  const g={team,nr,time,dt};
  if(home==="T"){g.kind="tournoi";g.where=away;g.isHome=away==="Diekirch";g.opp=away?("Turnier in "+away):"Turnier, Ort noch offen";}
  else{g.kind="match";g.isHome=home==="CHEV";g.opp=(g.isHome?"vs ":"@ ")+(g.isHome?away:home);}
  g.cup=/^coupe/i.test(nr);
  g.postponed=!dt;
  return g;
}).sort((a,b)=>(a.dt?a.dt.start:Infinity)-(b.dt?b.dt.start:Infinity)||(a.time||"99").localeCompare(b.time||"99"));}

const today=new Date();today.setHours(0,0,0,0);
const fmtDay=new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"2-digit"});
const fmtDM=new Intl.DateTimeFormat("de-DE",{day:"numeric",month:"short"});
const fmtMonth=new Intl.DateTimeFormat("de-DE",{month:"long",year:"numeric"});
const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const add=(x,n)=>new Date(x.getFullYear(),x.getMonth(),x.getDate()+n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function row(g,{showDate=false}={}){
  const past=g.dt&&g.dt.end<today;
  let timeHtml;
  if(g.postponed) timeHtml="–";
  else if(showDate){
    timeHtml=g.dt.range?`WE<small>${g.dt.start.getDate()}.–${fmtDM.format(g.dt.end)}</small>`
      :`${g.time||"–"}<small>${fmtShort.format(g.dt.start)}</small>`;
  } else timeHtml=g.time||"offen";
  const tags=[];
  if(g.cup) tags.push(`<span class="tag cup">Coupe 1/8</span>`);
  if(g.postponed) tags.push(`<span class="tag late">Remis, Termin offen</span>`);
  else if(g.dt.range) tags.push(`<span class="tag warn">Tag offen</span>`);
  else if(!g.time) tags.push(`<span class="tag warn">Uhrzeit offen</span>`);
  tags.push(g.isHome?`<span class="tag home">${g.kind==="tournoi"?"in Diekirch":"Heim"}</span>`:`<span class="tag away">${g.kind==="tournoi"?"Turnier auswärts":"Auswärts"}</span>`);
  return `<div class="game${g.isHome?" is-home":""}${past?" past":""}">
    <div class="time">${timeHtml}</div>
    <div class="info"><div class="team">${esc(teamName[g.team])}</div><div class="opp">${esc(g.opp)}</div></div>
    <div class="tags">${tags.join("")}</div></div>`;
}

/* ---------- Heim / Auswärts ---------- */
const filt={we:"all",team:"all"};
const pass=(g,f)=>f==="all"||(f==="home")===g.isHome;
const emptyTxt={all:"Keine Spiele",home:"Keine Heimspiele",away:"Keine Auswärtsspiele"};
function renderSeg(id,key,list,rerender){
  const h=list.filter(g=>g.isHome).length;
  const opts=[["all","Alle",list.length],["home","Heim",h],["away","Auswärts",list.length-h]];
  const el=document.getElementById(id);
  el.innerHTML=opts.map(([f,l,n])=>`<button data-f="${f}" aria-pressed="${filt[key]===f}">${l} <span>${n}</span></button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{filt[key]=b.dataset.f;rerender();});
}

/* ---------- Wochenende ---------- */
let sat=(()=>{let x=add(today,1);while(x.getDay()!==6)x=add(x,1);return x;})();
function renderWeekend(){
  const fri=add(sat,-1),sun=add(sat,1),mon=add(sat,-5),thu=add(sat,-2);
  document.getElementById("we-title").textContent=`${fmtDM.format(sat)} – ${fmtDM.format(sun)}`;
  const diff=Math.round((sat-add(today,0))/DAY);
  document.getElementById("we-sub").textContent=diff<0?"vergangenes Wochenende":diff<=7?"nächstes Wochenende":`in ${Math.ceil(diff/7)} Wochen`;
  const fixed=GAMES.filter(g=>g.dt&&!g.dt.range);
  const we=fixed.filter(g=>g.dt.start>=fri&&g.dt.start<=sun);
  const open=GAMES.filter(g=>g.dt&&g.dt.range&&g.dt.start<=sun&&g.dt.end>=fri);
  const mid=fixed.filter(g=>g.dt.start>=mon&&g.dt.start<=thu);
  renderSeg("we-filter","we",[...mid,...we,...open],renderWeekend);
  const F=g=>pass(g,filt.we);
  const weF=we.filter(F),openF=open.filter(F),midF=mid.filter(F);
  let html="";
  if(midF.length){
    html+=`<h2 class="day">Unter der Woche <small>${fmtDM.format(mon)} – ${fmtDM.format(thu)}</small></h2><div class="list">${midF.map(g=>row(g,{showDate:true})).join("")}</div>`;
  }
  for(let x=fri;x<=sun;x=add(x,1)){
    const list=weF.filter(g=>+g.dt.start===+x);
    if(!list.length&&x.getDay()===5) continue;
    html+=`<h2 class="day">${fmtDay.format(x)}</h2>`;
    html+=list.length?`<div class="list">${list.map(g=>row(g)).join("")}</div>`:`<div class="empty">${emptyTxt[filt.we]}</div>`;
  }
  if(openF.length) html+=`<h2 class="day">Am Wochenende, Tag noch offen</h2><div class="list">${openF.map(g=>row(g)).join("")}</div>`;
  document.getElementById("we-body").innerHTML=html;
}
document.getElementById("prev").onclick=()=>{sat=add(sat,-7);renderWeekend();};
document.getElementById("next").onclick=()=>{sat=add(sat,7);renderWeekend();};

/* ---------- Mannschaft ---------- */
const sel=document.getElementById("team"),from=document.getElementById("from"),to=document.getElementById("to");
sel.innerHTML=TEAMS.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join("");
const seasonStart=d(2026,8,1),seasonEnd=d(2027,6,30);
function setRange(q){
  if(q==="all"){from.value=iso(seasonStart);to.value=iso(seasonEnd);}
  else if(q==="30"){from.value=iso(today);to.value=iso(add(today,30));}
  else{from.value=iso(today);to.value=iso(seasonEnd);}
  renderTeam();
}
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>setRange(b.dataset.q));
function renderTeam(){
  const t=sel.value;
  const f=from.value?new Date(from.value+"T00:00"):seasonStart;
  const e=to.value?new Date(to.value+"T00:00"):seasonEnd;
  let list=GAMES.filter(g=>g.team===t&&(g.postponed||(g.dt.end>=f&&g.dt.start<=e)));
  const body=document.getElementById("team-body"),seg=document.getElementById("team-filter");
  const any=GAMES.some(g=>g.team===t);
  if(!any){seg.hidden=true;body.innerHTML=`<div class="empty">Für ${esc(teamName[t])} ist auf chev.lu kein Spielplan veröffentlicht.</div>`;return;}
  seg.hidden=false;renderSeg("team-filter","team",list,renderTeam);
  list=list.filter(g=>pass(g,filt.team));
  if(!list.length){body.innerHTML=`<div class="empty">Keine Termine in diesem Zeitraum. Wähle „Ganze Saison“, um alle zu sehen.</div>`;return;}
  const groups=new Map();
  list.forEach(g=>{const k=g.dt?fmtMonth.format(g.dt.start):"Termin offen";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g);});
  body.innerHTML=[...groups].map(([k,gs])=>`<h2 class="day month">${esc(k)}</h2><div class="list">${gs.map(g=>row(g,{showDate:true})).join("")}</div>`).join("");
}
[sel,from,to].forEach(el=>el.addEventListener("change",renderTeam));

/* ---------- Tabs ---------- */
function show(which){
  const we=which==="we";
  document.getElementById("view-we").hidden=!we;document.getElementById("view-team").hidden=we;
  document.getElementById("tab-we").setAttribute("aria-selected",we);document.getElementById("tab-team").setAttribute("aria-selected",!we);
}
document.getElementById("tab-we").onclick=()=>show("we");
document.getElementById("tab-team").onclick=()=>show("team");
if(location.hash==="#mannschaft") show("team");

from.value=iso(today);to.value=iso(seasonEnd);
/* ---------- Daten laden / Aktualisieren ---------- */
const standEl=document.getElementById("stand"),reloadBtn=document.getElementById("reload");
const loadedDay=new Date().toDateString();
function loadData(){
  reloadBtn.classList.add("busy");reloadBtn.disabled=true;
  // ?t=… umgeht den Zwischenspeicher von GitHub, damit immer die neueste data.json kommt
  return fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(data=>{
    GAMES=buildGames(data.spiele);
    const st=new Date(data.stand);
    standEl.textContent="Stand "+st.toLocaleDateString("de-DE")+" "+st.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+(data.fehler&&data.fehler.length?" (teilweise veraltet)":"");
    renderWeekend();renderTeam();
  }).catch(()=>{
    standEl.textContent="Daten nicht geladen";
    if(!GAMES.length) document.getElementById("we-body").innerHTML='<div class="empty">Die Spieldaten konnten nicht geladen werden. Tippe oben auf Aktualisieren.</div>';
  }).finally(()=>{reloadBtn.classList.remove("busy");reloadBtn.disabled=false;});
}
// Neuer Tag seit dem Öffnen: ganze Seite neu laden, damit "heute" und das nächste Wochenende stimmen
function refresh(){ if(new Date().toDateString()!==loadedDay) location.reload(); else loadData(); }
reloadBtn.addEventListener("click",refresh);
// App vom Homebildschirm wieder geöffnet: automatisch aktualisieren
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
loadData();
</script>
