# Holt viermal am Tag die Spielpläne von chev.lu und speichert sie in data.json.
# Startet auch per Hand: Reiter "Actions" -> "Spielplan aktualisieren" -> "Run workflow".
name: Spielplan aktualisieren

on:
  schedule:
    # Zeiten in UTC: 04:15, 10:15, 16:15, 20:15
    # = 06:15, 12:15, 18:15, 22:15 Sommerzeit / 05:15, 11:15, 17:15, 21:15 Winterzeit in Luxemburg.
    # Mehrere Läufe, weil chev.lu manchmal kurz eine Sicherheitsprüfung statt der Seite zeigt.
    - cron: "15 4,10,16,20 * * *"
  workflow_dispatch:        # erlaubt den Start per Knopfdruck

permissions:
  contents: write           # nötig, damit die Action data.json speichern darf

concurrency:                # läuft schon eine Aktualisierung, wartet die nächste
  group: spielplan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotheken installieren
        run: pip install requests beautifulsoup4

      - name: chev.lu auslesen
        id: scrape
        # chev.lu zeigt manchmal kurz eine Sicherheitsprüfung statt der Seite.
        # Deshalb bis zu 3 Versuche: sofort, nach 5 und nach weiteren 10 Minuten.
        # Klappt keiner, merken wir uns das, speichern aber trotzdem, was funktioniert hat.
        # Der Fehler wird im letzten Schritt gemeldet (-> E-Mail).
        run: |
          python scrape.py && exit 0
          echo "Versuch 1 gestört, neuer Versuch in 5 Minuten"; sleep 300
          python scrape.py && exit 0
          echo "Versuch 2 gestört, neuer Versuch in 10 Minuten"; sleep 600
          python scrape.py || echo "fehler=1" >> "$GITHUB_OUTPUT"

      - name: data.json speichern
        run: |
          git config user.name "spillplang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Spielplan aktualisiert"
          git pull --rebase -q || true
          git push

      - name: Störung melden
        if: steps.scrape.outputs.fehler == '1'
        # Ein einzelner gestörter Lauf ist kein Problem, der nächste holt es nach.
        # Rot (-> E-Mail) wird es erst, wenn seit über 24 Stunden kein Lauf geklappt hat.
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timedelta
          d = json.load(open("data.json", encoding="utf-8"))
          ok = d.get("letzter_erfolg")
          alter = datetime.fromisoformat(d["stand"]) - datetime.fromisoformat(ok) if ok else None
          if alter is not None and alter < timedelta(hours=24):
              print(f"::warning::Lauf gestört, letzte erfolgreiche Aktualisierung {ok} – noch keine Meldung.")
              sys.exit(0)
          print(f"::error::Seit über 24 Stunden keine erfolgreiche Aktualisierung (zuletzt {ok}). Details im Schritt 'chev.lu auslesen'.")
          sys.exit(1)
          PY
